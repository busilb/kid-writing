<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作文招式闯关</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:#fff8f0;color:#222;font-size:18px;line-height:1.6}
header{background:#c62828;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}
header a{color:#fff;text-decoration:none}
#starBox{font-size:15px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:12px}
.card{display:block;background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);color:#222;text-decoration:none}
.card.task{border:3px solid #2e7d4f}
.card.workshop{border:3px dashed #f0a060}
.card.review{background:#fff4e0;border:2px solid #f0b040}
h2{font-size:21px;margin:0 0 8px;color:#c62828}
h3{font-size:18px;margin:12px 0 6px;color:#1e5aa8}
.tip{color:#666;font-size:15px}
.small{font-size:14px;color:#888}
.big{font-size:22px;font-weight:bold;color:#1e5aa8;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{display:block;background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:3px solid transparent;cursor:pointer;color:#222;text-decoration:none}
.lv.done{border-color:#2e7d4f}.lv.lock{opacity:.45;cursor:not-allowed}
.lv .n{font-size:14px;color:#888}.lv .t{font-size:19px;font-weight:bold}.lv .s{font-size:14px;color:#666}
.badge{text-align:center;background:#fff3e6;border-radius:14px;padding:10px 4px;font-size:15px}
.badge .em{font-size:34px}.badge.off{filter:grayscale(1);opacity:.4}
.bar{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar span{display:block;height:100%;background:#f0a020}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps span{flex:1;text-align:center;padding:6px 0;border-radius:10px;background:#eee;font-size:15px}
.steps.small7 span{font-size:12px;padding:5px 0}
.steps span.on{background:#c62828;color:#fff}.steps span.ok{background:#2e7d4f;color:#fff}
.btn{display:inline-block;margin:10px 8px 0 0;padding:11px 18px;font-size:18px;border:0;border-radius:12px;background:#1e5aa8;color:#fff;cursor:pointer;text-decoration:none}
.btn.alt{background:#888}.btn.go{background:#2e7d4f}.btn.sm{padding:4px 10px;font-size:14px;margin:2px}
.btn[disabled]{opacity:.5}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;font-size:17px;border:2px solid #ddd;border-radius:12px;background:#fff;cursor:pointer;color:#222}
.opt.right{border-color:#2e7d4f;background:#e8f6ec}.opt.wrong{border-color:#c62828;background:#ffecec}
.opt.picked{border-color:#1e5aa8;background:#eef4fc}
.opt .num{display:inline-block;width:26px;height:26px;border-radius:13px;background:#1e5aa8;color:#fff;text-align:center;margin-right:8px;line-height:26px}
input[type=text],textarea,select{width:100%;font-size:18px;padding:10px;border:2px solid #ddd;border-radius:10px;font-family:inherit;margin-top:6px}
textarea{min-height:140px;line-height:1.7}textarea.mid{min-height:110px}
.fb{margin-top:12px;padding:12px;border-radius:12px;background:#eef4fc}
.fb.good{background:#e8f6ec}.fb.warn{background:#fff4e0}
.ex{background:#fff3e6;border-left:5px solid #f0a060;padding:10px 12px;border-radius:8px;margin:8px 0}
.pair{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid #eee}
.pair .bad{background:#f4f4f4;color:#888;padding:10px;text-decoration:line-through}
.pair .good{background:#e8f6ec;padding:10px}
.pair span{display:block;font-size:13px;font-weight:bold;text-decoration:none;margin-bottom:2px}
.pair .bad span{color:#999}.pair .good span{color:#2e7d4f}
.pair .why{background:#fff;padding:6px 10px;font-size:14px;color:#666}
ul{padding-left:22px;margin:6px 0}
.chips span{display:inline-block;margin:4px;padding:6px 12px;background:#ffecec;color:#c62828;border-radius:20px;font-size:16px;cursor:pointer}
.chips span.sel{background:#c62828;color:#fff}
nav.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
nav.tools a{flex:1 1 45%;text-align:center;padding:11px;background:#fff3e6;border:2px solid #f0c9a8;border-radius:12px;color:#222;text-decoration:none;font-size:16px}
.rate{display:flex;align-items:center;gap:4px;margin:4px 0}
.rate .dl{flex:1;font-size:16px}.rate .dl i{display:block;font-size:12px;color:#999;font-style:normal}
.st{font-size:26px;background:none;border:0;color:#f0a020;cursor:pointer;padding:0 4px}
.essay{background:#fffdf8;border:1px solid #eee;border-radius:10px;padding:10px;line-height:1.9;margin:8px 0}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.essayItem{padding:10px 0;border-bottom:1px dashed #eee}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #eee;padding:5px;text-align:center;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.row{margin:12px 0}.row label{font-weight:bold;display:block}
input[type=range]{width:100%}
svg{width:100%;height:170px;background:#fff;border-radius:12px}
@media (max-width:420px){.cmp2{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:8px}.lv .t{font-size:17px}}
@media print{header,nav,.btn{display:none}}
.card.micro{border:3px solid #f0a020}
.voice{font-size:13px;color:#888;margin-top:4px}
.fb.guide{background:#fff8d6;border:2px dashed #f0c040}
.moodRow{margin-bottom:10px}.moodRow .btn{font-size:16px;padding:8px 12px}
.rec{background:#f3f6fb;border-radius:12px;padding:10px;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kpis div{background:#fff3e6;border-radius:12px;padding:8px 2px}.kpis b{display:block;font-size:22px;color:#c62828}.kpis span{font-size:12px;color:#666}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wcell{background:#f4f4f4;border-radius:10px;padding:6px;font-size:13px;text-align:center}
.wcell span{display:block;font-size:22px}.wcell b{display:block;font-size:12px;color:#2e7d4f}
.wcell.m0{opacity:.5}.wcell.m4{background:#fff4c2}
svg.chart{height:auto;max-height:260px}
.printcard{background:#fffdf5;border:2px solid #eee;border-radius:12px;padding:10px;margin:10px 0}
.printcard table{font-size:13px}.printcard td,.printcard th{white-space:normal}
@media print{body *{visibility:hidden}.printcard,.printcard *{visibility:visible}.printcard{position:absolute;left:0;top:0;width:100%;border:0}.printcard .btn{display:none}}

/* ===== v1.2 ===== */
.ladderStrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lv.mini{flex:1 1 30%;padding:8px 6px;text-align:center;min-width:84px}
.lv.mini .n{font-size:20px;margin:0}
.lv.mini .t{font-size:13px;font-weight:700;margin:2px 0 0}
.taskwhere{font-size:13px;color:#666;margin-top:8px}
.card.map,.card.tourcard,.card.draft{display:block;text-decoration:none;color:inherit}
.card.map{background:#eef4fb;border-color:#1e5aa8}
.card.tourcard{background:#fff8e6;border-color:#f0a020}
.card.draft{background:#fdf2e7;border-color:#e08a2a}
.homefoot nav.tools a{font-size:14px}
.mapHead{background:#f6f6f6}
.stageHead{margin:14px 0 6px;padding:6px 8px;border-radius:8px;background:#f0f0f0;font-size:14px}
.stageHead.now{background:#eef4fb;box-shadow:inset 0 0 0 2px #1e5aa8}
.stageHead.pass{background:#eaf6ee}
.gateTip{font-size:12px;color:#777;margin:4px 0 2px}
.mline{display:flex;flex-wrap:wrap;gap:8px}
.mnode{flex:1 1 30%;min-width:92px;box-sizing:border-box;padding:10px 6px;border:2px solid #ddd;border-radius:12px;text-align:center;text-decoration:none;color:inherit;background:#fff;position:relative}
.mnode .em{font-size:22px;display:block}
.mnode b{display:block;font-size:14px}
.mnode i{display:block;font-size:11px;color:#777;font-style:normal}
.mnode.sm{flex:1 1 22%;min-width:76px}
.mnode.now{border-color:#1e5aa8;box-shadow:0 0 0 3px #d8e5f5;animation:breathe 2.4s ease-in-out infinite}
.mnode.done{border-color:#2e7d4f;background:#f4fbf6}
.mnode.due{border-color:#f0a020;background:#fff8e6}
.mnode.lock{opacity:.6;background:#f5f5f5;cursor:pointer}
.mnode.m3{box-shadow:inset 0 -4px 0 #2e7d4f}
.mnode.m4{box-shadow:inset 0 -4px 0 #f0a020}
.mlock{font-size:11px;color:#c62828}
.stagebar{margin:4px 0;background:#eee;border-radius:6px;position:relative;height:20px;overflow:hidden}
.stagebar .small{position:absolute;left:6px;top:2px;z-index:2;font-size:12px}
.stagebar span{display:block;height:100%;background:#cfe3f5}
.stagebar i{position:absolute;right:6px;top:2px;font-size:12px;font-style:normal}
.rhetbar{height:18px;background:#eee;border-radius:6px;position:relative;overflow:hidden;margin:4px 0}
.rhetbar span{display:block;height:100%;background:#2e7d4f}
.rhetbar em{position:absolute;left:60%;top:0;bottom:0;width:2px;background:#c62828}
.pair.cmp .bad{text-decoration:none}
.hint1{border-left:4px solid #f0a020}
.fb.tic{background:#fff8e6}
.oneoff{margin:4px 0}
details.rest summary{cursor:pointer;font-size:13px;color:#555}
.tourArt{display:flex;gap:6px;justify-content:center;margin:12px 0}
.tourArt i{width:22px;height:22px;border-radius:50%;background:#cfe3f5;display:block}
.tourArt.art2 i{border-radius:4px;background:#e7eef7}
.tourArt.art3 i{background:#eaf6ee}
.card.tour{text-align:center}
.cheerBadge{display:block;font-size:56px;text-align:center;animation:pop .5s ease-out}
.conf{position:relative;height:40px;overflow:hidden}
.conf i{position:absolute;top:-12px;width:7px;height:12px;display:block;animation:fall 1.6s linear infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(52px) rotate(240deg)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 3px #d8e5f5}50%{box-shadow:0 0 0 6px #e8f0fa}}
@media (prefers-reduced-motion:reduce){.cheerBadge,.conf i,.mnode.now{animation:none}}
.toolCard{display:block;padding:10px;border:1px solid #ddd;border-radius:10px;text-decoration:none;color:inherit;background:#fafafa;margin:4px 0}
.toolCard b{font-size:15px}
.toolWhen{font-size:12px;color:#777}
nav.tools2{display:block}
.card.tg h4{margin:4px 0 6px;font-size:15px}
.ladder3{padding-left:20px}
.ladder3 li{margin:8px 0}
.bankItem{border:1px solid #e3e3e3;border-radius:10px;padding:8px;margin:8px 0;background:#fafafa}
.tagRow{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.tagChip{border:1px solid #bbb;border-radius:12px;padding:3px 8px;font-size:12px;background:#fff;cursor:pointer}
.tagChip.sel{background:#1e5aa8;color:#fff;border-color:#1e5aa8}
.imitBox{margin-top:6px}
.imitBox input{width:100%;box-sizing:border-box}
.step4{display:inline-flex;gap:3px;vertical-align:middle}
.step4 i{width:9px;height:9px;border-radius:50%;background:#ddd;display:block}
.step4 i.on{background:#2e7d4f}
.parseList li{margin:8px 0}
.parseList summary{cursor:pointer;font-size:13px;color:#1e5aa8}
label.blk{display:block;margin:6px 0;font-size:14px}
@media (max-width:420px){.mnode{flex:1 1 44%}.mnode.sm{flex:1 1 44%}.lv.mini .t{font-size:12px}}
</style>
</head>
<body>
<header><a href="#home"><h1>作文招式闯关</h1></a><span id="starBox"></span></header>
<main id="app"></main>
<script>
/* 作文招式闯关 · 关卡数据（原创内容，面向小学四年级） */
const BODY_RE = '手|脚|腿|心跳|心怦|心扑通|心口|脸|眼|泪|汗|嗓|嘴|牙|低头|抬头|背|肩|膝|鼻|耳|抖|咬|攥|握|跺|缩|屏住|发麻|发软|直冒|打转|蹦|喘';
const ACT_RE = '抓|握|跑|跳|推|拉|咬|踩|蹬|抬|低|转|扔|拍|捏|攥|扑|躲|甩|钻|冲';

const LEVELS = [
/* ================= 通用招式 ================= */
{id:'say', group:'root', badge:'🗣️', name:'先说后写', tag:'写不出来？先讲给爸爸听',
 learn:['写不出来，常常不是不会写，是没想好。先用嘴说，比直接写容易得多。',
        '用三句话说清楚一件事：<b>这件事是什么</b>；<b>我的心情从什么变成了什么</b>；<b>我发现（明白）了什么</b>。',
        '说完这三句，作文的开头、中间、结尾就都有了。'],
 pairs:[{bad:'我们去了游乐园，玩了很多东西，很开心。', good:'这件事是第一次坐过山车。我的心情从害怕变成了兴奋。我发现，最怕的事做完了，反而最想再来一次。', why:'三句话就把事情、心情变化、发现都说清楚了。'}],
 ex:'这件事是两天军训。我的心情从期待变成了累，最后变成了骄傲。我明白了，班级优秀靠的是每个人都认真。',
 quiz:[
  {q:'写作文卡住、不知道写什么的时候，第一步最好做什么？',o:['先查一篇范文抄下来','先用三句话讲给爸爸听','先想一个好听的开头'],a:1,e:'先说出来，内容就有了。好听的开头可以最后再想。'},
  {q:'“三句话”里的第二句要说什么？',o:['那天的天气','我的心情从什么变成了什么','去了哪些地方'],a:1,e:'心情的变化，就是作文中间最重要的部分。'},
  {q:'下面哪一句最像“第三句：我发现了什么”？',o:['我们去了公园，又去了商场。','原来，摔倒了再站起来并不难。','今天天气晴朗。'],a:1,e:'第三句是你自己的发现，常用“原来……”“我明白了……”。'}],
 rewrite:[
  {p:'把下面这句流水账，改成“我的心情从……变成了……”：<br><b>我们去了游乐园，玩了过山车，又玩了旋转木马，然后回家了。</b>',checks:[{re:'从[\\s\\S]{1,10}变成|从[\\s\\S]{1,10}到',msg:'有“从……变成……”'}],min:10}],
 write:{p:'想一件这周发生的事，写出你的三句话（每句一行）。',checks:[{re:'这件事|这次|那天|那次',msg:'第一句：说出是什么事'},{re:'从[\\s\\S]{1,12}(变成|到)',msg:'第二句：心情从……变成……'},{re:'明白|发现|原来|知道了|懂得',msg:'第三句：我发现（明白）了……'}],min:25},
 think:['这周发生了哪件事，让我心情有变化？','一开始我是什么心情？后来变成了什么？','这件事让我发现了什么？'],
 tell:'把你的三句话，一字不差地读给爸爸听。',
 detect:{checks:['从[\\s\\S]{1,20}(到|变成)','明白|原来|发现|懂得'],need:1}},

{id:'sense', group:'root', badge:'👃', name:'五感观察', tag:'看、听、闻、摸、尝',
 learn:['写东西不只用眼睛。耳朵、鼻子、手、舌头也能帮你写。',
        '<b>看</b>到颜色、形状；<b>听</b>到声音；<b>闻</b>到气味；<b>摸</b>到软硬冷热；<b>尝</b>到酸甜苦辣。',
        '一段话里用上三种感觉，读的人就像站在你旁边。'],
 pairs:[{bad:'食堂的饭很香。', good:'红烧肉的香味飘过来，我的肚子“咕噜”叫了一声。', why:'写出闻到什么、肚子怎样，比“很香”更有画面。'}],
 ex:'橘子剥开，“嗤”的一声，一股酸酸甜甜的香味冒了出来。橘瓣软软的，凉凉的，放进嘴里一咬，汁水甜得我眯起了眼。',
 quiz:[
  {q:'“锅里的油‘滋啦’一声响”用的是哪种感觉？',o:['看','听','尝'],a:1,e:'“滋啦”是声音，用的是耳朵。'},
  {q:'哪一句用了“摸”的感觉？',o:['小狗的毛软软的，暖乎乎的','小狗是黄色的','小狗汪汪叫'],a:0,e:'软软的、暖乎乎的，是手摸到的。'},
  {q:'写“食堂的饭很香”，怎样改更好？',o:['食堂的饭非常非常香','红烧肉的香味飘过来，我的肚子“咕噜”叫了一声','食堂的饭特别好吃'],a:1,e:'写出闻到什么、肚子有什么反应，比说“很香”更有画面。'}],
 rewrite:[
  {p:'把这句改得有画面，至少用两种感觉：<br><b>下雨了。</b>',checks:[{re:'哗|滴|嗒|沙|声|响',msg:'用了“听”'},{re:'凉|冷|湿|打在|落在|冰',msg:'用了“摸”或身体感觉'},{re:'灰|白|亮|暗|看|水花|雾',msg:'用了“看”'}],need:2,min:12}],
 write:{p:'写一种你喜欢的水果或零食，写 60 字以上，至少用上三种感觉。',checks:[{re:'红|黄|绿|紫|圆|颜色|亮|看',msg:'看'},{re:'声|咔|嘎|嗤|响|听',msg:'听'},{re:'香|味|闻',msg:'闻'},{re:'软|硬|滑|凉|冰|毛|摸|黏',msg:'摸'},{re:'甜|酸|苦|辣|咸|尝',msg:'尝'}],need:3,min:60},
 think:['我要写的东西，看起来是什么颜色、什么样子？','它会发出声音吗？闻起来什么味道？','摸上去、吃起来是什么感觉？'],
 tell:'读给爸爸听，让爸爸闭上眼睛猜：你写的是什么？',
 detect:{checks:['红|黄|绿|紫|白|黑|圆|亮|颜色','声|响|叫|哗|咔','香|味|闻','软|硬|滑|凉|冰|烫|暖','甜|酸|苦|辣|咸'],need:2}},

{id:'zoom', group:'root', badge:'🔍', name:'镜头放大', tag:'把一个瞬间写成一段',
 learn:['流水账是“去了 A，又去了 B”，像快进。好作文是把一个瞬间放慢，像慢镜头。',
        '放大一个瞬间，问自己五个问题：<b>我看到了什么？听到了什么？身体有什么感觉？有人说了什么？我做了什么？</b>',
        '一篇作文，只要放大两个镜头就够了。'],
 pairs:[{bad:'我们去了动物园，看了熊猫，看了猴子，又看了老虎。', good:'熊猫抱着竹子“咔嚓咔嚓”地啃，嘴边沾满了碎叶子。我趴在栏杆上，笑得停不下来。', why:'只写看熊猫那一会儿，有声音、有动作、有我。'}],
 ex:'教官喊：“站好，不许动！”太阳照在脸上，一滴汗顺着我的额头往下流，痒痒的。我咬着牙，手指紧紧贴着裤缝，一动也不敢动。',
 quiz:[
  {q:'哪一段是“镜头放大”，不是流水账？',o:['我们去了动物园，看了熊猫，看了猴子，又看了老虎。','熊猫抱着竹子“咔嚓咔嚓”地啃，嘴边沾满了碎叶子。我趴在栏杆上，笑得停不下来。','动物园里的动物很多，很好玩。'],a:1,e:'第二段只写看熊猫那一会儿，有声音、有动作、有我。'},
  {q:'一篇 400 字的作文，最好放大几个镜头？',o:['一个也不用','两个','五个以上'],a:1,e:'两个镜头写细，别的一句带过。'},
  {q:'放大镜头时，下面哪一项最能让人觉得“真”？',o:['有人说的一句原话','一个好听的成语','一句“这真是难忘的一天”'],a:0,e:'原话最真实，一读就有现场感。'}],
 rewrite:[
  {p:'下面是流水账。只挑其中一个瞬间，把它放大：<br><b>运动会上，我跑了 60 米，又跳了远，最后拿了奖状。</b>',checks:[{re:'“|”|"|说|喊|叫',msg:'有人说的话'},{re:'手|脚|腿|心跳|心怦|脸|汗|眼|嗓|喘',msg:'身体的感觉'}],min:20}],
 write:{p:'挑最近一件事里最难忘的一个瞬间，写 80 字以上。要有：原话、动作、身体感觉。',checks:[{re:'“|”|"|说|喊|叫',msg:'有人说的原话'},{re:ACT_RE,msg:'有动作'},{re:'手|脚|腿|心跳|心怦|脸|汗|眼|嗓|喘|膝|背',msg:'有身体感觉'}],min:80},
 think:['我挑哪一个瞬间？那时候我在哪里？','我看到了什么？听到了什么？','有人说了一句什么话？','我的身体有什么感觉？我做了什么动作？'],
 tell:'读给爸爸听，问爸爸：你听完，脑子里有画面了吗？',
 detect:{checks:['“|”|说[：:]|喊',ACT_RE,BODY_RE],need:3}},

{id:'feel', group:'root', badge:'🗝️', name:'感受钥匙', tag:'不写“我很……”，写出来让人看得见',
 learn:['<b>钥匙 1：用身体代替“我很……”</b>。我很紧张 → 手心冒汗，心怦怦直跳。',
        '<b>钥匙 2：我以为……没想到……</b>。先写本来怎么想，再写真实发生了什么。',
        '<b>钥匙 3：别人怎么样 → 我怎么样</b>。看到同学被批评，我把背挺得更直了。',
        '<b>钥匙 4：外面……心里……</b>。我们没有欢呼，可我心里像装了一团火。'],
 pairs:[{bad:'我很紧张。', good:'我的手心冒出了汗，心怦怦直跳。', why:'不说“紧张”两个字，读的人也感觉到了。'},{bad:'拿到第一名，我很开心。', good:'我们安静地坐着，没有欢呼，可我心里像装了一团火。', why:'外面安静、心里热，反差让感受更真。'}],
 ex:'我以为上台很简单，没想到一走到台中间，腿就软了。我看见台下的妈妈朝我点头，深吸一口气，终于开口了。',
 quiz:[
  {q:'哪一句用了“钥匙 1：用身体代替我很……”？',o:['我很害怕。','我的腿一下子软了，手心全是汗。','我非常非常害怕。'],a:1,e:'腿软、出汗，是身体在说话。'},
  {q:'“我以为考试会很难，没想到题目都练过”用的是哪把钥匙？',o:['钥匙 1','钥匙 2','钥匙 4'],a:1,e:'“我以为……没想到……”就是钥匙 2，让文章有个转弯。'},
  {q:'“大家都在笑，可我心里一点也笑不出来”用的是哪把钥匙？',o:['钥匙 2','钥匙 3','钥匙 4'],a:2,e:'外面在笑，心里笑不出来，是钥匙 4“外面……心里……”。'},
  {q:'下面哪一句最不像感受句？',o:['我的脸“唰”地红了','这真是快乐的一天','我攥紧了拳头'],a:1,e:'“快乐的一天”是套话，看不见画面。'}],
 rewrite:[
  {p:'把“<b>我很紧张。</b>”改成用身体写的感受句：',checks:[{re:'手|脚|腿|心跳|心怦|心扑通|脸|汗|眼|嗓|牙|攥|抖|咬',msg:'写了身体的动作'},{re:'^(?![\\s\\S]*很紧张)',msg:'没有再写“很紧张”'}],min:8},
  {p:'用“我以为……没想到……”写一句话（场景随你）：',checks:[{re:'以为',msg:'有“我以为”'},{re:'没想到|结果|谁知',msg:'有“没想到”'}],min:10}],
 write:{p:'写一个“心跳最快”的瞬间，80 字以上，至少用两把钥匙。',checks:[{re:'手|脚|腿|心跳|心怦|心扑通|脸|汗|眼泪|嗓|牙|攥|抖',msg:'钥匙 1：身体'},{re:'以为[\\s\\S]{0,40}(没想到|结果|谁知)',msg:'钥匙 2：我以为……没想到'},{re:'看到|看见|听到|发现[\\s\\S]{0,30}我',msg:'钥匙 3：别人 → 我'},{re:'心里',msg:'钥匙 4：心里……'}],need:2,min:80},
 think:['那一刻，我的手、脚、心、脸在干什么？','事情发生前，我以为会怎样？结果呢？','旁边的人在干什么？我看到后怎么做的？'],
 tell:'读给爸爸听，再告诉爸爸：你用了哪两把钥匙？',
 detect:{checks:[BODY_RE,'以为[\\s\\S]{0,40}(没想到|结果|谁知)','心里'],need:2}},

{id:'frame', group:'root', badge:'🧱', name:'三段结构', tag:'开头期待，中间镜头，结尾变化',
 learn:['<b>开头</b>：写事前的心情，期待、好奇或者紧张，两三句就够。',
        '<b>中间</b>：放大两个镜头，一个最难的时候，一个转折或者最高兴的时候，这部分最长。',
        '<b>结尾</b>：写心情的变化，再加一句感悟。',
        '先写提纲：开头一句、镜头一一句、镜头二一句、结尾一句，再动笔。'],
 pairs:[{bad:'早上我们去春游，中午吃饭，下午回家，很开心。', good:'开头：出发前一晚，我兴奋得睡不着。镜头一：爬山爬到一半，腿像灌了铅。镜头二：登上山顶，风一吹，所有的累都不见了。结尾：原来，最美的风景在最累之后。', why:'有期待、有两个镜头、有变化和感悟。'}],
 ex:'开头：去军训前，我天天在网上看别人的军训，很期待。<br>镜头一：第一天踩错拍子，手心冒汗。<br>镜头二：宣布一等奖，我们没欢呼，心里却像装了一团火。<br>结尾：从慌张到骄傲，我明白了优秀靠大家。',
 quiz:[
  {q:'三段结构里，哪一部分应该写得最长？',o:['开头','中间','结尾'],a:1,e:'中间放大两个镜头，是最精彩的部分。'},
  {q:'开头最适合写什么？',o:['事前的心情','整件事的结果','我明白了什么'],a:0,e:'开头写期待或紧张，为后面的变化做铺垫。'},
  {q:'结尾要有哪两样？',o:['天气和时间','心情的变化 + 一句感悟','去过的所有地方'],a:1,e:'变化让文章完整，感悟让文章有深度。'}],
 rewrite:[
  {type:'order', p:'下面四句顺序乱了。按“开头—中间—中间—结尾”的顺序，依次点一点：',items:['我盼着学会骑车，盼了一整个夏天。','刚骑上去，“哐”的一声我就摔倒了。','爸爸一松手，我竟然骑出去好远！','原来，摔倒了也没关系。']}],
 write:{p:'给最近的一件事写一个提纲，四行：开头、镜头一、镜头二、结尾。',checks:[{re:'开头',msg:'有开头'},{re:'镜头一|镜头1|中间一|第一个镜头',msg:'有镜头一'},{re:'镜头二|镜头2|中间二|第二个镜头',msg:'有镜头二'},{re:'结尾[\\s\\S]*(明白|原来|发现|懂得|知道)',msg:'结尾有感悟'}],min:40},
 think:['事前我是什么心情？','最难的时候发生了什么？','什么时候心情变好了？','最后我发现了什么？'],
 tell:'拿着提纲讲给爸爸听，每一行说一两句。',
 detect:{checks:['^[\\s\\S]{0,80}(期待|盼|想象|好奇|紧张|兴奋|害怕)','(明白|原来|发现|懂得)[\\s\\S]{0,80}$'],need:2}},

{id:'ends', group:'root', badge:'🎬', name:'开头结尾', tag:'开头不写天气，结尾不说套话',
 learn:['<b>开头两招</b>：用一个动作开头，或者用一句原话开头。不写“今天天气晴朗”。',
        '例：“立正！”教官一声吼，我的腿一下子绷直了。',
        '<b>结尾两招</b>：“我终于明白，……不是……，而是……。”或者“原来，……。”',
        '不写：“我明白了坚持的重要性”“这真是难忘的一天”。要写<b>你自己的</b>发现。'],
 pairs:[{bad:'今天天气晴朗，阳光明媚，我们去春游。', good:'“快点！车要开了！”妈妈在楼下喊，我抓起书包就往下冲。', why:'一句原话加一个动作，读的人马上进入现场。'},{bad:'我明白了坚持的重要性。', good:'原来，最难的不是跑完，是跑到一半还不放弃。', why:'写的是你自己的发现，别人写不出来。'}],
 ex:'开头：“我们家要来一只小猫啦！”妈妈一说完，我就跳了起来。<br>结尾：原来，照顾一只小猫，比我想的累，也比我想的快乐。',
 quiz:[
  {q:'哪个开头更好？',o:['今天天气晴朗，阳光明媚。','“快点！要迟到了！”妈妈在门口喊。','今天是一个难忘的日子。'],a:1,e:'用一句原话开头，一下子就把人拉进现场。'},
  {q:'哪个结尾更像“自己的发现”？',o:['我明白了坚持的重要性。','这真是难忘的一天。','原来，最难的不是跑完，是跑到一半还不放弃。'],a:2,e:'第三句是你自己从这件事里想到的，别人写不出来。'},
  {q:'“我终于明白，……不是……，而是……”这个公式适合放在哪里？',o:['开头','结尾','标题'],a:1,e:'这是感悟句，放在结尾。'}],
 rewrite:[
  {p:'把这个开头改掉，用一个动作或一句原话开头：<br><b>今天天气晴朗，我们去春游。</b>',checks:[{re:'^(?![\\s\\S]*(天气|晴朗|阳光明媚))',msg:'没有写天气'},{re:'“|”|"|说|喊|跑|跳|背|拉|冲|抓',msg:'用了原话或动作'}],min:8},
  {p:'用“我终于明白，……不是……，而是……”给一件事写结尾：',checks:[{re:'明白',msg:'有“我终于明白”'},{re:'不是[\\s\\S]+而是',msg:'有“不是……而是……”'},{re:'^(?![\\s\\S]*重要性)',msg:'没有“……的重要性”这种套话'}],min:12}],
 write:{p:'给一件事写一个开头和一个结尾（分两行）。开头不写天气，结尾写你自己的发现。',checks:[{re:'^(?![\\s\\S]*(天气|晴朗|阳光明媚|万里无云))',msg:'开头没写天气'},{re:'“|”|"|说|喊',msg:'用了原话（或动作）'},{re:'明白|原来|发现|懂得',msg:'结尾有自己的发现'},{re:'^(?![\\s\\S]*(重要性|难忘的一天|很开心))',msg:'没有套话'}],need:4,min:30},
 think:['这件事的第一秒，有人说了什么、或者我做了什么？','从这件事里，我自己想到了什么？（不是老师说的道理）'],
 tell:'把开头和结尾读给爸爸听，问爸爸：想不想知道中间发生了什么？',
 detect:{checks:['^(?![\\s\\S]{0,25}(天气|晴朗|阳光明媚|万里无云))','(明白|原来|发现|懂得)[\\s\\S]{0,80}$'],need:2}},

/* ================= 题材专项 ================= */
{id:'person', group:'genre', badge:'🧑', name:'写人', tag:'一个特点 + 一件事证明', unit:'我的“自画像”、小小“动物园”',
 learn:['写人不用从头写到脚。先想好：这个人最大的特点是什么？（爱笑、马虎、热心……）',
        '再找<b>一件事</b>来证明这个特点。事情写细，人就活了。',
        '外貌只写一两处和特点有关的，比如写爱笑，就写他的眼睛一笑就眯成一条缝。'],
 pairs:[{bad:'我的同桌长着大大的眼睛，高高的鼻子，小小的嘴巴。她很热心。', good:'我的同桌是个“热心肠”。上次我的橡皮掉了，她二话不说钻到桌子底下，捡起来还帮我吹了吹灰。', why:'不罗列五官，用一件事证明“热心”。'}],
 ex:'爸爸是个“马大哈”。有一次他要出门开会，在门口转了三圈：“我的钥匙呢？”妈妈笑着指了指他的手——钥匙就攥在他自己手里。',
 quiz:[
  {q:'写人，最先要想好什么？',o:['他长什么样','他最大的特点','他多大年纪'],a:1,e:'先定特点，后面的事情都围着它写。'},
  {q:'想写奶奶“勤劳”，哪件事最能证明？',o:['奶奶的头发白了','奶奶天不亮就起来给全家做早饭','奶奶住在乡下'],a:1,e:'做早饭这件事，一看就知道奶奶勤劳。'},
  {q:'写一个“爱笑”的人，哪句外貌描写最合适？',o:['他的眼睛一笑就眯成一条缝','他穿着一件蓝衣服','他的个子很高'],a:0,e:'外貌要和特点有关，眯成一条缝的眼睛就是在说“爱笑”。'}],
 rewrite:[
  {p:'用一件事证明这个特点：<br><b>我的妈妈很细心。</b>',checks:[{re:'有一次|那天|上次|每次|一次',msg:'有一件具体的事'},{re:'说|“|拿|放|摸|叠|看|帮|塞|检查',msg:'有动作或原话'}],min:20}],
 write:{p:'写一个你熟悉的人：先写一句他的特点，再用一件事证明，80 字以上。',checks:[{re:'是个|是一个|特点|总是|最',msg:'说出了特点'},{re:'有一次|那天|上次|一次',msg:'用一件事证明'},{re:'“|”|说|喊',msg:'有他说的话'},{re:'笑|眼|手|脸|皱|跑|拿|推|拍|攥|指',msg:'有动作或神态'}],need:3,min:80},
 think:['我要写谁？他最大的特点是什么？','哪一件事最能看出这个特点？','那件事里，他说了什么、做了什么？'],
 tell:'读给爸爸听，问爸爸：猜猜我写的是谁？',
 detect:{checks:['是个|是一个|总是|特点','有一次|那天|上次|一次'],need:2}},

{id:'animal', group:'genre', badge:'🐢', name:'动物 · 植物', tag:'五感观察 + 写出变化', unit:'我的动物朋友、写观察日记',
 learn:['写动物、植物，先用五感观察：看样子、听声音、闻气味、摸手感。',
        '再写<b>变化</b>：今天和昨天不一样，刚来时和现在不一样。有变化，文章就有了故事。',
        '最好再加一件你和它之间的小事。'],
 pairs:[{bad:'我家的小乌龟很可爱，我很喜欢它。', good:'刚买回来时，小乌龟只有硬币那么大，一碰就把头缩进壳里。现在它一见我拿虾干，就伸长脖子往前爬。', why:'写出了从前和现在的变化，还有动作。'}],
 ex:'窗台上的绿豆泡了一夜。第二天早上，豆子胀得圆滚滚的，裂开一道小口，冒出一个白白的小芽，像一个小逗号。我摸了摸，滑滑的，凉凉的。',
 quiz:[
  {q:'写观察日记，什么最能让文章有故事？',o:['写出变化','写它的名字','写它多少钱'],a:0,e:'今天和昨天不一样，就是故事。'},
  {q:'“小猫‘喵呜’一声跳上沙发”用了哪些感觉？',o:['听和看','闻','尝'],a:0,e:'“喵呜”是听到的，跳上沙发是看到的。'},
  {q:'哪一句写出了变化？',o:['小狗是白色的','小狗刚来时躲在纸箱里，现在一听到我回家就冲到门口','小狗很可爱'],a:1,e:'“刚来时……现在……”就是变化。'}],
 rewrite:[
  {p:'把这句写出变化：<br><b>我种的花开了。</b>',checks:[{re:'刚|一开始|以前|前几天|昨天|原来',msg:'写了从前的样子'},{re:'现在|今天|后来|终于|变成',msg:'写了现在的样子'}],min:15}],
 write:{p:'写一种你养过或观察过的动物、植物，80 字以上，写出它的样子和一个变化。',checks:[{re:'红|黄|绿|白|黑|圆|尖|毛|叶|颜色',msg:'写了样子（看）'},{re:'声|叫|响|香|味|软|硬|滑|凉',msg:'用了另一种感觉'},{re:'刚|一开始|以前|昨天|原来',msg:'写了从前'},{re:'现在|今天|后来|终于|变成|长成',msg:'写了现在'}],need:3,min:80},
 think:['我要写哪种动物或植物？它长什么样？','它会发出什么声音？摸起来什么感觉？','它和以前比，有什么不一样？'],
 tell:'读给爸爸听，问爸爸：你能想象出它的样子吗？',
 detect:{checks:['刚|一开始|以前|原来|昨天','现在|后来|终于|变成|长成'],need:2}},

{id:'place', group:'genre', badge:'🗺️', name:'写景 · 地方', tag:'移步换景，每处一个亮点', unit:'推荐一个好地方、我的乐园',
 learn:['写一个地方，不要什么都写。按你走的顺序写：先到哪儿，再到哪儿，最后到哪儿。',
        '每到一处，只写<b>一个</b>最吸引你的亮点，写细。',
        '用“走进……”“沿着……往前走”“再往前，就是……”把几处连起来。'],
 pairs:[{bad:'公园里有花、有树、有湖、有亭子，还有很多人，很漂亮。', good:'走进公园大门，迎面是一片月季，红的、粉的挤在一起。沿着小路往前走，就到了湖边，几只野鸭正“嘎嘎”地追着游。', why:'按顺序走，每处只写一个亮点。'}],
 ex:'走进小区后门，先看到一棵大桂花树，一到秋天，香味能飘到三楼。绕过桂花树，是一个小小的游乐场，滑梯被我们滑得亮亮的。再往前，就是我最喜欢的小池塘，里面住着十几条红鲤鱼。',
 quiz:[
  {q:'写景最好按什么顺序写？',o:['想到哪写到哪','按走的先后顺序','先写最远的'],a:1,e:'跟着脚步走，读的人才不会迷路。'},
  {q:'每到一处，应该写多少？',o:['把看到的都写上','只写一个最吸引你的亮点','只写名字'],a:1,e:'一个亮点写细，比十样东西列一遍好。'},

/* 排比检测用的收紧正则（原 (..) 反向引用会把“我的…我的…我的”误判成排比） */
const PB_REP = '((?=[一-龥]{2})[^的了是就很也个一们你我他她它那这，。！？；：、“”\\n]{2})[^。！？!?；;\\n]{1,24}\\1[^。！？!?；;\\n]{1,24}\\1';
/* “有……的，有……的，有……的”“有的……有的……有的”“……得……，……得……，……得……”
   这三种是四年级最常用的排比句式，PB_REP 的虚词黑名单正好把它们挡在外面，所以单列。 */
const PB_YOU = '有[^。！？!?；;，,、\\n]{1,14}的[，,、][^。！？!?；;\\n]{0,4}有[^。！？!?；;，,、\\n]{1,14}的[，,、][^。！？!?；;\\n]{0,4}有';
const PB_YOUDE3 = '有的[^。！？!?；;\\n]{1,30}有的[^。！？!?；;\\n]{1,30}有的';
const PB_DE3 = '得[^。！？!?；;，,、\\n]{1,6}[，,、][^。！？!?；;，,、\\n]{0,10}得[^。！？!?；;，,、\\n]{1,6}[，,、][^。！？!?；;，,、\\n]{0,10}得';
/* 关卡「写一写」判定排比用这一条：四种句式任意一种算过（宁可宽松，也不能把对的句子判错） */
const PB_ANY = '(?:' + PB_REP + ')|(?:' + PB_YOU + ')|(?:' + PB_YOUDE3 + ')|(?:' + PB_DE3 + ')';

{id:'parallel', group:'rhetoric', badge:'🎹', name:'排比', tag:'三句同样的句式，推着往前走',

{id:'hyperbole', group:'rhetoric', badge:'🎈', name:'夸张', tag:'说得过头一点，让人一下记住',

        '<b>怎么找</b>：先想清楚你要夸的是哪一样（太饿？太累？太冷？太急？），再把它放大到不可能的程度。',
        '<b>用在哪里</b>：放在最难受或者最好笑的那一下。写观察日记、写信的时候少用。',
        '<b>用量</b>：一篇 1 处就够。句句夸张，读的人一句也不信了；而且真事里的关键信息（分数、名次、时间）不能夸张。'],

  {bad:'我等了很久很久很久。', good:'我在校门口等妈妈，等到天都快黑成了一瓶墨水。', why:'把“很久”换成一个画面。“很久很久很久”只是在重复。'}],

  {q:'哪一句是夸张？',o:['我饿得能吃下一头牛','我有点饿了','我的肚子饿了'],a:0,e:'“吃下一头牛”不可能，但一读就知道有多饿。'},

  {q:'一篇作文里夸张用几处合适？',o:['一处','每段一处','越多越好'],a:0,e:'夸张像辣椒，放一点提味，放多了就没法吃了。'}],

const pad = n => (n < 10 ? '0' : '') + n;
const fmt = x => x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
const today = () => fmt(new Date());
const addDays = (d, n) => { const p = d.split('-').map(Number); const x = new Date(p[0], p[1] - 1, p[2]); x.setDate(x.getDate() + n); return fmt(x); };

/* ============ 存档（兼容 v1.0） ============ */
function defaults(s) {
  s = s && typeof s === 'object' ? s : {};
  s.lv = s.lv || {}; s.stars = s.stars || 0; s.mode = s.mode || 'dad'; s.lines = s.lines || [];
  s.essays = s.essays || []; s.ratings = s.ratings || []; s.days = s.days || [];
  s.rewards = s.rewards || []; s.spent = s.spent || 0; s.redeem = s.redeem || [];
  s.genreOpen = !!s.genreOpen; s.ws = s.ws || null;
  return s;
}
let S = defaults(JSON.parse(localStorage.getItem(KEY) || '{}'));
function save() {
  localStorage.setItem(KEY, JSON.stringify(S));
  const r = rankInfo();
  $('starBox').innerHTML = `${r.name} · ⭐ ${avail()}`;
}
const avail = () => S.stars - S.spent;
function markActive() { const t = today(); if (!S.days.includes(t)) S.days.push(t); }
function star(n) { if (n > 0) { S.stars += n; markActive(); } save(); }
function streak() {
  let d = S.days.includes(today()) ? today() : addDays(today(), -1), n = 0;
  while (S.days.includes(d)) { n++; d = addDays(d, -1); }
  return n;
}
function rankInfo() {
  let i = 0; RANKS.forEach((r, k) => { if (S.stars >= r[0]) i = k; });
  const next = RANKS[i + 1];
  return { name: RANKS[i][1], next: next ? next[1] : null, need: next ? next[0] - S.stars : 0, idx: i };
}
const lvState = id => S.lv[id] = S.lv[id] || { step: 0, done: false, start: Date.now(), tries: 0 };
const tryFail = id => { lvState(id).tries = (lvState(id).tries || 0) + 1; save(); };
const rootDone = () => LEVELS.filter(l => l.group === 'root').every(l => (S.lv[l.id] || {}).done);
const LAD_ = id => LADDER.find(x => x.id === id);
const lvDone = id => !!(S.lv[id] || {}).done;
function unlocked(L) {
  const l = LAD_(L.id); if (!l) return true;
  const req = l.requires || [];
  if (L.group === 'rhetoric') {
    const inner = req.filter(r => (LAD_(r) || {}).stage === 3), outer = req.filter(r => (LAD_(r) || {}).stage !== 3);
    return inner.every(lvDone) && (outer.every(lvDone) || S.rhetoricOpen);
  }
  if (L.group === 'genre') return req.every(lvDone) || S.genreOpen;
  return req.every(lvDone);
}

/* ============ 检查工具 ============ */
function runChecks(text, checks, need) {
  const res = checks.map(c => ({ msg: c.msg, ok: new RegExp(c.re).test(text) }));
  const n = res.filter(r => r.ok).length;
  return { res, pass: n >= (need || checks.length), n };
}
function fbHtml(r, min, len) {
  const good = r.res.filter(x => x.ok), bad = r.res.filter(x => !x.ok);
  let h = '';
  if (good.length) h += `<div class="okline">做到了：${good.map(x => '✅ ' + x.msg).join('　')}</div>`;
  if (bad.length) {
    h += `<div class="oneoff"><b>就差一个：${bad[0].msg}</b></div>`;
    if (bad.length > 1) h += `<details class="rest"><summary>还有 ${bad.length - 1} 条，等一下再看</summary><ul>${bad.slice(1).map(x => `<li>⬜ ${x.msg}</li>`).join('')}</ul></details>`;
  }
  if (min) h += `<div class="small">字数 ${len} / ${min}${len < min ? '（再补一个细节就够了）' : '（够了）'}</div><div class="bar"><span style="width:${Math.min(100, Math.round(100 * len / min))}%"></span></div>`;
  return h;
}
function detectUsed(L, text) {
  if (!L.detect) return false;
  const n = L.detect.checks.filter(re => new RegExp(re).test(text)).length;
  return n >= L.detect.need;
}
const BODY_LIST = BODY_RE.split('|');
function essayItems(t, genre) {
  const n = zhLen(t);
  const sents = t.split(/[。！？!?\n]/).filter(s => s.trim());
  const body = sents.filter(s => BODY_LIST.some(w => s.includes(w))).length;
  const items = [
    ['字数（' + n + ' 字，四年级 350 字以上）', n >= 350, '再补一个镜头的细节，字数就够了。'],
    ['开头没写天气', !/天气|晴朗|阳光明媚|万里无云/.test(t.slice(0, 25)), '第一句换成期待、动作或者一句原话。'],
    ['至少 2 句身体感受句（找到 ' + body + ' 句）', body >= 2, '找一句“我很……”，改成身体的动作。'],
    ['用了“我以为……没想到”或“心里……”', /以为[\s\S]{0,40}没想到|心里/.test(t), '在中间加一句“我以为……没想到……”。'],
    ['有人说的原话', /[“"「]/.test(t) || /说[:：]/.test(t), '写一句别人说的原话，用引号括起来。'],
    ['结尾有感悟', /明白|原来|发现|懂得|知道了/.test(t.slice(-90)), '结尾加一句“我终于明白……”或“原来……”。']
  ];
  const G = genre && L_(genre);
  if (G && G.group === 'genre') items.push(['专项招式：' + G.tag, detectUsed(G, t), '回到“' + G.name + '”那一关看看招式，挑一处加进来。']);
  return items;
}

function quiz(L, i, right) {
  const box = $('quiz'); if (!box) return;
  if (i >= L.quiz.length) {
    const ok = right >= L.quiz.length - 1;
    box.innerHTML = `<div class="fb ${ok ? 'good' : 'warn'}">答对 ${right} / ${L.quiz.length} 题。${ok ? '很好，下一步！' : '再试一次，看看解析。'}</div>` + (ok ? `<button class="btn" onclick="next('${L.id}',2)">下一步：改一改</button>` : `<button class="btn alt" onclick="quiz(L_('${L.id}'),0,0)">再试一次</button>`);
    if (ok) star(right); else tryFail(L.id);
    return;
  }
  const Q = L.quiz[i];
  box.innerHTML = `<div class="small">第 ${i + 1} / ${L.quiz.length} 题</div><div><b>${Q.q}</b></div>` + Q.o.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('') + '<div id="qe"></div>';
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ok = k === Q.a;
    box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === Q.a) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    $('qe').innerHTML = `<div class="fb ${ok ? 'good' : 'warn'}">${ok ? '答对了！' : '再想想：'}${Q.e}</div><button class="btn" id="qn">下一题</button>`;
    $('qn').onclick = () => quiz(L, i + 1, right + (ok ? 1 : 0));
  });
}

/* 排序题：依次点选 */
function shuffledIdx(n, seed) {
  const a = [...Array(n).keys()]; let x = seed || 7;
  for (let i = n - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.push(a.shift());
  return a;
}
function orderWidget(boxId, R, seed, onOk) {
  const box = $(boxId), disp = shuffledIdx(R.items.length, seed); let picked = [];
  function draw(msg) {
    box.innerHTML = `<div>${R.p}</div>` + disp.map(k => { const pos = picked.indexOf(k); return `<button class="opt ord ${pos >= 0 ? 'picked' : ''}" data-k="${k}">${pos >= 0 ? '<b class="num">' + (pos + 1) + '</b>' : ''}${R.items[k]}</button>`; }).join('') + `<button class="btn alt" id="ordReset">重来</button>` + (msg || '');
    box.querySelectorAll('.ord').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; if (picked.includes(k)) return; picked.push(k);
      if (picked.length < R.items.length) { draw(); return; }
      const ok = picked.every((v, i) => v === i);
      draw(ok ? '<div class="fb good">顺序对了！（+2 ⭐）</div>' : '<div class="fb warn">顺序不太对，点“重来”再试试。想想：哪句是开始？哪句是结果？</div>');
      if (ok) onOk(); else if (R.lv) tryFail(R.lv);
    });
    $('ordReset').onclick = () => { picked = []; draw(); };
  }
  draw();
}
function rewrite(L, i) {
  const box = $('rw'), R = L.rewrite[i];
  if (!R) { box.innerHTML = `<div class="fb good">改得好！</div><button class="btn" onclick="next('${L.id}',3)">下一步：写一写</button>`; return; }
  if (R.type === 'order') {
    box.innerHTML = `<div class="small">第 ${i + 1} / ${L.rewrite.length} 题</div><div id="ordBox"></div><div id="rf"></div>`;
    orderWidget('ordBox', Object.assign({ lv: L.id }, R), i + L.id.length, () => { star(2); $('rf').innerHTML = '<button class="btn" id="rn">下一题</button>'; $('rn').onclick = () => rewrite(L, i + 1); });
    return;
  }
  box.innerHTML = `<div class="small">第 ${i + 1} / ${L.rewrite.length} 题</div><div>${R.p}</div><input type="text" id="ri">${VOICE_TIP}<button class="btn" id="rb">检查</button><div id="rf"></div>`;
  $('rb').onclick = () => {
    const t = $('ri').value.trim(), r = runChecks(t, R.checks, R.need), len = hanLen(t), ok = r.pass && len >= (R.min || 0);
    $('rf').innerHTML = `<div class="fb ${ok ? 'good' : 'warn'}">${fbHtml(r, R.min || 0, len)}${ok ? '<b>改得好！（+2 ⭐）</b>' : '差一点，按没打勾的地方再改改。'}</div>` + (ok ? '<button class="btn" id="rn">下一题</button>' : '');
    if (ok) { star(2); $('rn').onclick = () => rewrite(L, i + 1); } else tryFail(L.id);
  };
}
function checkWrite(id) {
  const L = L_(id), t = $('wt').value.trim(), r = runChecks(t, L.write.checks, L.write.need), len = hanLen(t), ok = r.pass && len >= L.write.min;
  let h = `<div class="fb ${ok ? 'good' : 'warn'}">${fbHtml(r, L.write.min, len)}${ok ? '<b>写得真好！（+3 ⭐）</b><br>如果是用语音说的，错字你自己改过了吗？改错字也是在练修改。' : '没打勾的地方，<b>只改一处</b>就好。'}</div>`;

}
function review(id) {

  if (!R) { app.innerHTML = `<div class="card review"><h2>复习：${L.name}</h2><div id="ordBox"></div><div id="rf"></div></div>`; let ft = true; orderWidget('ordBox', L.rewrite[0], Date.now() % 97, () => { if (ft) { const s = S.lv[id]; s.firstOk = (s.firstOk || []).concat(today()); } reviewDone(id); }); $('ordBox').addEventListener('click', e => { if (e.target.id === 'ordReset') ft = false; }); return; }

const RT = {};

}

const KZ_FAKE = '(?:考了|得了|打了|拿了|第)[^。！？!?；;，,、\\n]{0,6}?(?:一百二十|一百五十|两百|三百|一千|一万)分?|(?:全校|全班|全国)第一(?:名)?';
const RH_RE = { BI_QUANT, BI_FRAME, BI_NOUN, BI_GUESS, RN_A, RN_B, RN_HUMAN, PB_YOUDE, PB_REP, PB_ANY, RN_ACT, KZ_W, KZ_FRAME, KZ_NUM, KZ_BODY, KZ_LIT, KZ_FAKE };
const RH_KIND = { metaphor: 'bi', personify: 'rn', parallel: 'pb', hyperbole: 'kz' };
const RH_NAME = { bi: '比喻', rn: '拟人', pb: '排比', kz: '夸张' };

const rhClauses = t => String(t == null ? '' : t).split(/[。！？!?；;，,、\n]/).map(x => x.trim()).filter(Boolean);
const rhSents = t => String(t == null ? '' : t).split(/[。！？!?；;\n]/).map(x => x.trim()).filter(Boolean);

function scanBi(t) {
  const g = new RegExp(BI_GUESS), a = new RegExp(BI_QUANT), b = new RegExp(BI_FRAME), c = new RegExp(BI_NOUN);
  const hits = [];
  rhClauses(t).forEach(x => { if (g.test(x)) return; if (a.test(x) || b.test(x) || c.test(x)) hits.push(x); });
  return { n: hits.length, hits };
}
function scanRn(t) {
  const A = new RegExp(RN_A), B = new RegExp(RN_B), H = new RegExp(RN_HUMAN), hits = [];
  rhClauses(t).forEach(x => {
    /* 命中的那一段里本身带了人（“一进门我就掀开锅盖”里的“门…掀”），说明动作的主人是人，不算拟人 */
    const ms = [A.exec(x), B.exec(x)].filter(m => m && !H.test(m[0]));
    if (!ms.length) return;
    const first = Math.min.apply(null, ms.map(m => m.index)), h = x.search(H);
    if (h >= 0 && h < first) return;
    hits.push(x);
  });

}
const pbVoidOnly = s => s.split('').every(ch => PB_VOID.indexOf(ch) >= 0);
function pbSent(s) {
  const cs = s.split(/[，,、]/).map(x => x.trim()).filter(Boolean);
  for (let i = 0; i + 2 < cs.length; i++) {
    const a = cs[i], b = cs[i + 1], c = cs[i + 2];
    if ([a, b, c].some(x => x.length < 2 || x.length > 24)) continue;
    const ta = a.slice(-2);
    if (ta === b.slice(-2) && ta === c.slice(-2) && !pbVoidOnly(ta)) return true;
    for (let k = 0; k <= 2 && k + 2 <= a.length; k++) {
      const an = a.substr(k, 2);
      if (PB_BLACK.indexOf(an) >= 0 || pbVoidOnly(an)) continue;
      const ib = b.indexOf(an), ic = c.indexOf(an);
      if (ib >= 0 && ib <= 2 && ic >= 0 && ic <= 2) return true;
    }
    if (a[0] === b[0] && a[0] === c[0] && a.slice(-1) === b.slice(-1) && a.slice(-1) === c.slice(-1)) return true;
  }
  return false;
}
function scanPb(t) {
  const Y = new RegExp(PB_YOUDE), hits = [];
  rhSents(t).forEach(s => { if (pbSent(s) || Y.test(s)) hits.push(s); });
  return { n: hits.length, hits };
}
function scanKz(t) {
  const L = new RegExp(KZ_LIT), F = new RegExp(KZ_FRAME), N = new RegExp(KZ_NUM), B = new RegExp(KZ_BODY), hits = [];
  rhClauses(t).forEach(x => { if (L.test(x)) return; if (F.test(x) || N.test(x) || B.test(x)) hits.push(x); });
  return { n: hits.length, hits };
}
const countBi = t => scanBi(t).n, countRn = t => scanRn(t).n, countPb = t => scanPb(t).n, countKz = t => scanKz(t).n;
const countBang = t => (String(t == null ? '' : t)
  .replace(/[“"][^”"]*[”"]/g, '')
  .replace(/(?:您好|你好)！/g, '')
  .replace(/(?:健康|快乐|顺利|进步|平安|如意|长寿)！/g, '')
  .match(/[！!]/g) || []).length;
const clicheKinds = t => RN_CLICHE_LIST.filter(w => String(t == null ? '' : t).indexOf(w) >= 0).length;
function rhetCount(t) { return { bi: countBi(t), rn: countRn(t), pb: countPb(t), kz: countKz(t), bang: countBang(t) }; }
function pbShare(t) { const n = zhLen(t); return n ? zhLen(scanPb(t).hits.join('')) / n : 0; }

const PILE = { bi: { abs: 4, per100: 2.0, min: 3 }, rn: { abs: 4, per100: 2.0, min: 3 }, pb: { abs: 2, per100: 1.0, min: 2 }, kz: { abs: 3, per100: 1.5, min: 3 }, bang: { abs: 3, per100: 2.0, min: 3 }, all: { abs: 6, per100: 3.0, min: 3 } };
const PILE_KEYS = ['bi', 'rn', 'pb', 'kz', 'bang', 'all'];
function piled(t) {
  const c = rhetCount(t), n = zhLen(t), all = c.bi + c.rn + c.pb + c.kz, o = { c, all };
  const hit = (k, v) => { const P = PILE[k]; return v >= P.abs || (n >= 60 && v >= (P.min || 2) && v * 100 / n >= P.per100); };
  o.bi = hit('bi', c.bi);
  o.rn = hit('rn', c.rn) || clicheKinds(t) >= RN_CLICHE_KINDS;
  o.pb = hit('pb', c.pb) || (c.pb > 1 && pbShare(t) >= 0.35) || (zhLen(t) >= 120 && pbShare(t) >= 0.35);
  o.kz = hit('kz', c.kz);
  o.bang = hit('bang', c.bang);
  o.all = hit('all', all);
  return o;
}
const pileKinds = t => { const p = piled(t); return PILE_KEYS.filter(k => p[k]); };
const PILE_TIP = {
  bi: '挑最准的那一个「像」留下，别的改成老实话——读的人才看得清。',
  rn: '太多东西在唱歌跳舞了。留一处，写它<b>真实</b>在干什么。',
  pb: '排比一篇只放一处最有劲。前后要有普通的句子，不然像在喊口号。',
  kz: '句句夸张，读的人就一句也不信了。留最好笑的那一处。',
  bang: '感叹号超过两个，劲就散了。把其中一句改成写动作。',
  all: '调料放多了。这一篇<b>只留 1–2 处</b>，剩下的下一篇再用。'
};
function pileTip(t) {
  const p = piled(t), n = zhLen(t) || 1;
  const k = PILE_KEYS.filter(x => p[x]).sort((a, b) => {
    const va = a === 'all' ? p.all : (a === 'bang' ? p.c.bang : p.c[a]), vb = b === 'all' ? p.all : (b === 'bang' ? p.c.bang : p.c[b]);
    return (vb * 100 / n - PILE[b].per100) - (va * 100 / n - PILE[a].per100);
  })[0];
  return k ? PILE_TIP[k] : '';
}
/* 整篇修辞反馈：先说好话，只提一条 */
function rhetAdvice(t) {
  if (zhLen(t) < 30) return '';
  const c = rhetCount(t), p = piled(t), good = [];
  ['bi', 'rn', 'pb', 'kz'].forEach(k => { if (c[k] >= 1 && !p[k]) good.push(`${RH_NAME[k]} ${c[k]} 处`); });
  let h = '';
  if (good.length) h += `<div class="fb good">这里用上了：${good.join('、')}——刚好。</div>`;
  const tip = pileTip(t);
  if (tip) h += `<div class="fb warn"><b>调料提醒：</b>${tip}</div>`;
  if (new RegExp(KZ_FAKE).test(t)) h += '<div class="fb warn">分数和名次不能夸张哦，一夸就变成假话了。别的地方照样可以夸。</div>';
  return h;
}
/* 口头禅检查 */
function fillerCheck(t) {
  const n = zhLen(t);
  if (n < 60) return [];
  return FILLERS.map(w => { const c = String(t).split(w).length - 1; return { w, c, per: Math.round(c * 1000 / n) / 10, lim: FILLER_LIMIT[w] }; })
    .filter(x => x.c >= 2 && x.per > x.lim)
    .sort((a, b) => (b.per - b.lim) - (a.per - a.lim))
    .slice(0, 2);
}
const FILLER_TIP = {
  然后: c => `「然后」有 ${c} 个。留一个，别的换成「接着」「过了一会儿」「就在这时」，或者直接分成两句。`,
  很: c => `「很」说了 ${c} 次。挑一个换成身体动作——心情词梯里有现成的。`,
  非常: c => `「非常」说了 ${c} 次。挑一个换成身体动作——心情词梯里有现成的。`,
  特别: c => `「特别」说了 ${c} 次。挑一个换成身体动作——心情词梯里有现成的。`,
  突然: c => `「突然」多了就不突然了。留一个，别的改成「没想到」「谁知」，或者写出前一秒的样子。`

function fillerHtml(t) {
  const f = fillerCheck(t);

  return `<div class="fb warn tic"><b>口头禅检查（不扣星）</b><ul>${f.map(x => `<li>${FILLER_TIP[x.w](x.c)}<span class="small">（每百字 ${x.per}，建议 ${x.lim}）</span></li>`).join('')}</ul></div>`;
}

/* ---------- 4. detectOk / mastery 第 4 级 ---------- */
function detectOk(L, text, essay) {
  if (!detectUsed(L, text)) return false;
  if (essay && (essay.hints || []).indexOf(L.id) >= 0) return false;
  const k = RH_KIND[L.id];
  if (k && piled(text)[k]) return false;
  return true;
}
innerCount = function (L) {
  const arr = S.essays.map(e => ({ t: e.v2 || e.v1, hints: e.hints || [] }))
    .concat(S.assess.filter(a => a.text).map(a => ({ t: a.text, hints: a.hints || [] })));
  let n = arr.filter(x => detectOk(L, x.t, x)).length;
  if (S.manual.some(m => m.lv === L.id)) n += 1;
  return n;
};
function lastWorks(k) {
  return S.essays.map(e => ({ d: e.d, t: e.v2 || e.v1, id: e.id, hints: e.hints || [] }))
    .concat(S.assess.filter(a => a.text).map(a => ({ d: a.d, t: a.text, id: null, hints: a.hints || [] })))
    .sort((a, b) => a.d < b.d ? -1 : 1).slice(-k);
}
function rhetRate() {
  const W = lastWorks(5); let A = 0, B = 0, tot = 0, ch = 0, lastP = '';
  W.forEach(x => {
    const c = rhetCount(x.t), p = piled(x.t), used = c.bi + c.rn + c.pb + c.kz;
    tot += used; ch += zhLen(x.t);
    if (used >= 1) { A++; const bad = PILE_KEYS.filter(k => p[k]); if (!bad.length) B++; else lastP = RH_NAME[bad[0]] || bad[0]; }
  });
  return { A, B, rate: A ? B / A : 0, per100: ch ? Math.round(tot * 1000 / ch) / 10 : 0, lastPile: lastP };
}

function hintGive(lv, where) {
  const H = HINTS[lv] || [], box = $('hintBox'); if (!box) return;
  if (S.exStage >= 2) {
    S.hintLog.push({ d: today(), lv, where, blocked: true }); save();
    const q = ((L_(lv) || {}).think || ['那一刻，你看见了什么？'])[0];
    box.innerHTML = `<div class="fb warn hint1">这一关先自己试。写完有两篇给你对照。<br>先想一想：${esc(q)}</div>`;

  hintBtnSync(lv, where);
}

  if (!canSpeak()) return;
  if (SPEAKING) { window.speechSynthesis.cancel(); SPEAKING = false; return; }
  const s = String(txt == null ? '' : txt).slice(0, 600); if (!s.trim()) return;

const BANK_TAGS = ['比喻', '拟人', '排比', '夸张', '五感', '身体感受', '原话', '开头', '结尾', '连接词', '句式'];
const TAG_KIND = { 比喻: 'bi', 拟人: 'rn', 排比: 'pb', 夸张: 'kz' };

  '从…变成…': '从[^。！？\\n]{1,14}(?:变成|到)[^。！？\\n]{0,14}',
  '我以为…没想到…': '(?:我)?以为[^。！？\\n]{1,40}?(?:没想到|结果|谁知)',
  '一…就…': '一[^。！？\\n]{1,8}就[^。！？\\n]{1,16}',

const hanOnly = t => String(t == null ? '' : t).replace(/[^一-龥]/g, '');
function maxOverlap(a, b) {
  a = hanOnly(a); b = hanOnly(b); let best = 0;
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) { let k = 0; while (i + k < a.length && j + k < b.length && a[i + k] === b[j + k]) k++; if (k > best) best = k; }
  return best;
}
const bankTagOk = (tag, text) => { const k = TAG_KIND[tag]; if (!k) return true; const c = rhetCount(text); return c[k] >= 1; };
function skeletonOf(t) { return Object.keys(SKELETON).filter(k => new RegExp(SKELETON[k]).test(t)); }
/* 整篇里"用上了同类"——不要求原句出现；原样照抄不算 */
function usedCheck(it, text, essayId) {
  if (maxOverlap(it.t, text) >= 10) return { ok: false, copy: true };
  const c = rhetCount(text), p = piled(text);
  const rt = (it.tags || []).filter(x => TAG_KIND[x]);
  if (rt.length) { const ok = rt.some(x => c[TAG_KIND[x]] >= 1 && !p[TAG_KIND[x]]); if (ok) return { ok: true }; }
  const tags = it.tags || [];
  if (tags.indexOf('五感') >= 0) { const Sn = L_('sense'); if (Sn && Sn.detect.checks.filter(re => new RegExp(re).test(text)).length >= 2) return { ok: true }; }
  if (tags.indexOf('身体感受') >= 0 && new RegExp(SKELETON['身体感受']).test(text)) return { ok: true };
  if (tags.indexOf('原话') >= 0 && new RegExp(SKELETON['原话']).test(text)) return { ok: true };
  if (tags.indexOf('连接词') >= 0) { const all = Object.keys(CONNECTORS).reduce((a, k) => a.concat(CONNECTORS[k]), []); if (all.some(w => connUsed(w, text))) return { ok: true }; }
  const sk = skeletonOf(it.t);
  if (sk.length) {
    const head = text.slice(0, 30), tail = text.slice(-90);
    if (tags.indexOf('开头') >= 0 && sk.some(k => new RegExp(SKELETON[k]).test(head))) return { ok: true };
    if (tags.indexOf('结尾') >= 0 && sk.some(k => new RegExp(SKELETON[k]).test(tail))) return { ok: true };
    if (sk.some(k => new RegExp(SKELETON[k]).test(text))) return { ok: true };
    return { ok: false };
  }
  return { ok: false, manual: true };
}
function graduateCheck(it) {
  const ids = (it.used || []).map(u => u.essayId).filter((v, i, a) => a.indexOf(v) === i);
  if ((it.tags || []).length >= 1 && (it.mimic || []).length >= 1 && (it.used || []).length >= 2 && ids.length >= 2 && addDays(it.d, 14) <= today()) it.graduated = true;
  return it.graduated;
}
function bankUseAll(text, essayId) {
  const out = [];
  S.bank.forEach(it => {
    if (it.graduated) return;
    if ((it.used || []).some(u => u.essayId === essayId)) return;
    const r = usedCheck(it, text, essayId);
    if (r.ok) { it.used = (it.used || []).concat({ essayId: essayId, d: today() }); graduateCheck(it); out.push(it.id); }

}
function parse() {
  app.innerHTML = `<div class="card"><h2>🔎 审题拆解器</h2><div class="tip">把题目先过一遍，30 秒。不用全写下来，心里答一遍就行。</div>
  <div class="row"><label>题目</label><input type="text" id="psIn" placeholder="比如：一次难忘的运动会"></div>
  <ol class="parseList">${TOPIC_PARSER.map((q, i) => `<li><b>${q.q}</b><details><summary>怎么想</summary><div class="small">${q.tip}</div></details></li>`).join('')}</ol>
  <div class="row"><label>这一篇只练哪一招？</label><select id="psAim"><option value="">选一招</option>${LEVELS.filter(L => lvDone(L.id)).map(L => `<option value="${L.id}">${L.badge} ${L.name}</option>`).join('')}</select><button class="btn go" onclick="parseAim()">存成这篇的目标</button></div>
  <div id="psOut"></div><a class="btn alt" href="#tools">回工具箱</a></div>`;
}
function parseAim() {
  const t = (($('psIn') || {}).value || '').trim(), a = ($('psAim') || {}).value;
  if (S.ws) { S.ws.aim = a; S.ws.aimTitle = t.slice(0, 40); save(); }
  const L = a && L_(a);
  $('psOut').innerHTML = `<div class="fb good"><b>这一篇的目标：</b>${t ? esc(t) : '（还没写题目）'}${L ? '，只练「' + L.name + '」：' + L.tag : ''}<br>${S.ws ? '已经存到工坊里了。' : '去工坊写的时候再选一次就好。'}</div><a class="btn go" href="#workshop">去工坊写</a>`;
}
function read() {
  if (!canSpeak()) { app.innerHTML = '<div class="card"><h2>🔊 朗读听一听</h2><div class="tip">这台设备不支持朗读。那就小声读给自己听——效果一样好。</div><a class="btn alt" href="#tools">回工具箱</a></div>'; return; }
  app.innerHTML = `<div class="card"><h2>🔊 朗读听一听</h2><div class="tip">听一遍。读起来卡住的地方，就是要改的地方。</div>
  <textarea id="rdBox" placeholder="把你写的粘进来"></textarea>${speakBtn("$('rdBox').value")}<a class="btn alt" href="#tools">回工具箱</a></div>`;
}

/* ---------- 12. 成长报告新增三块 ---------- */
function barRow(label, v, max, note) {
  return `<div class="stagebar"><div class="small">${label}</div><span style="width:${max ? Math.min(100, Math.round(100 * v / max)) : 0}%"></span><i>${note || v}</i></div>`;
}
function reportExtra() {
  const hw = hintWeekly(), R = rhetRate(), F = bankFunnel();
  let h = '<h3>卡住了看示范的次数（按周）</h3>' + (hw.length ? lineSvg(hw, '写之前求助的次数（越来越少就是进步）', '次') + '<div class="small">这条线往下走，说明她越来越能自己开头了。</div>' : '<div class="tip">还没有求助记录，很好。</div>');
  h += '<h3>修辞恰当使用率（近 5 篇）</h3>';
  if (!R.A) h += '<div class="tip">还没在整篇里用过修辞。</div>';
  else {
    h += `<div class="rhetbar"><span style="width:${Math.round(100 * R.rate)}%"></span><em></em></div>
    <div class="small">${R.B} / ${R.A} 篇用得刚好（${Math.round(100 * R.rate)}%）；平均每百字 ${R.per100} 处，刚好的区间是 0.5–2.0${R.lastPile ? '；最近一次堆砌：' + R.lastPile : ''}</div>`;
    if (R.rate < 0.6) h += `<div class="fb warn">调料放多了。下一篇只留 1–2 处。</div>`;
  }
  h += '<h3>句子银行漏斗</h3>';
  const m = Math.max(1, F.a);
  h += barRow('摘', F.a, m) + barRow('标', F.b, m) + barRow('仿', F.c, m) + barRow('用', F.d, m) + barRow('毕业', F.e, m);
  const drop = [['标', F.a - F.b], ['仿', F.b - F.c], ['用', F.c - F.d]].sort((a, b) => b[1] - a[1])[0];
  if (F.a && drop && drop[1] > 0) h += `<div class="small">掉得最狠的是「${drop[0]}」这一级 —— 这周先补两句。</div>`;
  const la = S.assess.filter(a => a.type === 'month').slice(-1)[0];
  if (S.exStage >= 3 && la && addDays(la.d, 2) > today()) h += `<h3>这个月的好坏对照</h3><a class="btn go" href="#pairs">这个月的好坏对照</a><div class="small">48 小时内可看。</div>`;
  return h;
}
const _report = report;
report = function () {
  _report();
  const h3 = Array.prototype.slice.call(app.querySelectorAll('h3')).filter(x => x.textContent.indexOf('测评记录') >= 0)[0];
  const html = reportExtra();
  if (h3) h3.insertAdjacentHTML('beforebegin', html); else app.querySelector('.card').insertAdjacentHTML('beforeend', html);
};
const _reportText = reportText;
reportText = function () {
  const hw = hintWeekly(), R = rhetRate(), F = bankFunnel();
  return _reportText() + '\n' + [
    '卡住看示范（近 4 周）：' + (hw.length ? hw.slice(-4).map(x => `${x.l} ${x.v} 次`).join('；') : '无记录') + '。',
    '修辞恰当使用率：' + (R.A ? `${Math.round(100 * R.rate)}%（${R.B}/${R.A} 篇），平均每百字 ${R.per100} 处。` : '还没在整篇里用过修辞。'),
    `句子银行漏斗：摘 ${F.a} / 标 ${F.b} / 仿 ${F.c} / 用 ${F.d} / 毕业 ${F.e}。`
  ].join('\n');
};
function pairs() {
  const done = LEVELS.filter(L => lvDone(L.id) && EX_PAIRS[L.id]);
  app.innerHTML = `<div class="card"><h2>好坏两篇对照</h2><div class="tip">写完以后才看，一次只借一招。</div>${done.length ? done.map(L => `<h3>${L.badge} ${L.name}</h3><div class="pair cmp"><div class="bad"><span>✗ 一般的写法</span>${EX_PAIRS[L.id].bad}</div><div class="good"><span>✓ 用上招式的写法</span>${EX_PAIRS[L.id].good}</div><div class="why">${EX_PAIRS[L.id].why}</div></div>`).join('') : '<div class="tip">先过几关再来看。</div>'}<a class="btn alt" href="#report">回报告</a></div>`;
}

/* ---------- 13. 接入既有流程 ---------- */
/* 自查项里加一条"修辞是调料"的提醒（不扣星，只提示） */
const _essayItems = essayItems;
essayItems = function (t, genre) {
  const items = _essayItems(t, genre);
  if (zhLen(t) >= 30 && PILE_KEYS.some(k => piled(t)[k])) items.push(['修辞是调料：这一篇放多了', false, pileTip(t)]);
  return items;
};
/* 作文自查页：补口头禅 + 修辞提示 */
const _doCheck = doCheck;
doCheck = function () {
  _doCheck();
  const t = ($('et') || {}).value || '';
  if (zhLen(t) < 50 || !$('eo')) return;
  $('eo').insertAdjacentHTML('beforeend', rhetAdvice(t) + fillerHtml(t) + speakBtn("$('et').value"));
  bankUseAll(t, 'check' + today());
};
/* #11 排比关补一条复核提示：正则过了但 scanPb 认不出来，说明只是词在重复 */
function pbRecheck(id, t) {
  if (id !== 'parallel' || zhLen(t) < 12) return '';
  if (scanPb(t).n > 0) return '';
  return '<div class="fb warn">这三句只是同一个词重复，句式还没排起来：试试每句开头都用同样的两个字（我盼着……／有……的）。</div>';
}
/* 关卡：写一写通过后给好坏对照；工坊第 5 步给口头禅+修辞 */
const _workshop = workshop;
workshop = function () {
  _workshop();
  if (!S.ws) return;
  const st = S.ws.step;
  if (S.ws.aimTitle) { const c = app.querySelector('.card'); if (c && st >= 3) c.insertAdjacentHTML('afterbegin', `<div class="small">这一篇的目标：${esc(S.ws.aimTitle)}${S.ws.aim ? ' · 只练「' + ((L_(S.ws.aim) || {}).name || '') + '」' : ''}</div>`); }
  if (st === 3) { const c = app.querySelector('.card'); if (c) c.insertAdjacentHTML('beforeend', hintBtnHtml(S.ws.genre || 'zoom', 'ws-pre')); }
  if (st === 4) {
    const c = app.querySelector('.card'), t = S.ws.v1 || '';
    if (c) c.insertAdjacentHTML('beforeend', rhetAdvice(t) + fillerHtml(t) + speakBtn('S.ws.v1'));
  }
  if (st === 5) { logPost(S.ws.genre); const c = app.querySelector('.card'); if (c) c.insertAdjacentHTML('beforeend', compareHtml(S.ws.genre) + speakBtn("$('v2').value")); }
};
const _wsSave = wsSave;
wsSave = function () {
  const W = S.ws, text = W ? (W.v2 || W.v1) : '';
  _wsSave();
  const e = S.essays[S.essays.length - 1];
  if (e) {
    e.hints = todayHints(); e.rhet = rhetCount(text); e.piled = pileKinds(text);
    e.bankUsed = bankUseAll(text, e.id);
    if (e.piled.length) S.pile.push({ d: today(), essayId: e.id, kind: e.piled[0], n: zhLen(text) });
  }
  const n = stageCheck();
  if (n) location.hash = '#cheer/' + n;
};
const _assessSave = assessSave;
assessSave = function () {
  const text = AS ? AS.text : '';
  _assessSave();
  const a = S.assess[S.assess.length - 1];
  if (a && a.text) {
    a.hints = todayHints(); a.rhet = rhetCount(a.text); a.piled = pileKinds(a.text);
    a.bankUsed = bankUseAll(a.text, 'as' + a.d);
    if (a.piled.length) S.pile.push({ d: today(), essayId: 'as' + a.d, kind: a.piled[0], n: a.chars || zhLen(a.text) });
  }
  stageCheck();
};
const _finish = finish;
finish = function (id) {
  const b = ($('best') || {}).value;
  _finish(id);
  bankFromBest(id, b);
  const n = stageCheck();
  if (n) location.hash = '#cheer/' + n;
};

/* ---------- 14. 家长页新增开关 ---------- */
const EX_STAGE_NAME = { 1: '1 多扶一点（写前可看一句示范，写完给好坏两篇）', 2: '2 先自己写（写前不给句子，只给问题；写完给对照）', 3: '3 只在月测后（写前写完都不给，月测后集中看）' };
function setExStage(v) { S.exStage = +v; save(); parent(); }
function manualAdd(lv) { S.manual.push({ lv, essayId: null, d: today(), by: 'dad' }); save(); parent(); }
function parentExtra() {
  const pre14 = S.hintLog.filter(x => /-pre$/.test(x.where) && !x.blocked && x.d >= addDays(today(), -13)).length;
  const st = stageNow(), allOk = STAGE_IDS[st].every(id => mastery(id) >= 3);
  let h = '<h3>范文使用阶段</h3><div class="small">范文「晚给、拆开给、给完就撤」。孩子连续两周很少点示范，就可以往上调一阶。调回来也随时可以。</div>';
  h += [1, 2, 3].map(v => `<label class="blk"><input type="radio" name="exs" ${S.exStage === v ? 'checked' : ''} onchange="setExStage(${v})"> ${EX_STAGE_NAME[v]}</label>`).join('');
  if (pre14 <= 2 && allOk && S.exStage < 3) h += `<div class="fb">近 14 天只点了 ${pre14} 次示范，可以试试第 ${S.exStage + 1} 阶段了。</div>`;
  h += `<h3>调料岛（修辞）</h3><label class="blk"><input type="checkbox" ${S.rhetoricOpen ? 'checked' : ''} onchange="S.rhetoricOpen=this.checked;save()"> 提前打开调料岛（通用招式还没过完也能练修辞）</label>`;
  h += `<div class="small">夸张多半是嘴上先说出来的，不一定写进作文里。听见她口头用上了，可以手动记一次：<button class="btn alt sm" onclick="manualAdd('hyperbole')">我听过她用上夸张了</button>（已记 ${S.manual.filter(m => m.lv === 'hyperbole').length} 次）</div>`;
  h += `<h3>新手引导</h3><a class="btn alt sm" href="#hello/1">再看一次引导</a>`;
  h += `<h3>阶段徽章</h3><div class="small">${STAGE_NO.map(n => `第 ${n} 阶 ${STAGE_NAME[n]}：${(S.stages[n] || {}).lvl ? TIER_NAME[S.stages[n].lvl] : '还没拿到'}`).join('；')}</div>`;
  return h;
}
const _parent = parent;
parent = function () {
  _parent();
  const h3 = Array.prototype.slice.call(app.querySelectorAll('h3')).filter(x => x.textContent.indexOf('星星兑换奖励') >= 0)[0];
  const html = parentExtra();
  if (h3) h3.insertAdjacentHTML('beforebegin', html); else app.querySelector('.card').insertAdjacentHTML('beforeend', html);
};

/* ---------- 15. 路由 ---------- */
PAGES.lines = bank;
/* 重新注册：PAGES 在 app.js/app2.js 里捕获的是旧引用，包装后必须重新挂一次 */
Object.assign(PAGES, { map, bank, tools, words, linker, parse, read, hello, pairs, report, parent, workshop });
const _route2 = route;
route = function () {
  const h = location.hash.slice(1) || 'home', p = h.split('/')[0], id = h.split('/')[1];
  if (p === 'cheer') { cheer(id); window.scrollTo(0, 0); return; }
  if (p === 'hello') { hello(id); window.scrollTo(0, 0); return; }
  _route2();
};
window.removeEventListener('hashchange', _route2);
window.addEventListener('hashchange', route);
save(); route();
</script>
